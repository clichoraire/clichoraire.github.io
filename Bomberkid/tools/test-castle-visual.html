BK.overlay={show(){},hide(){}};BK.music=null;
const ctx=document.querySelector('canvas').getContext('2d');
let current;
function show(index,detail=false){current=new BK.Adventure('adam',index);const W=current.world;W.time=15;current.state='play';for(const e of W.enemies)e.t=1;
if(detail){current.player.x=detail[0];current.player.y=detail[1];current.updateCamera(0,true);if(index===7&&detail[1]===11.5){current.player.x=17.5;current.player.y=14.5;}current.render(ctx);}
else {const cam=new BK.Camera(1280,800);cam.fit(W.cols,W.rows,{top:50,bottom:35,left:30,right:30});W.render(ctx,cam,{noShake:true});}
}
for(let i=5;i<10;i++){const b=document.createElement('button');b.textContent=BK.stageList()[i].id+' '+BK.stageList()[i].name;b.onclick=()=>show(i);document.querySelector('header').append(b);}
for(const [title,i,pos] of [['Braises',5,[13.5,47.5]],['Tours',5,[13.5,14.5]],['Bibliothèque',7,[17.5,39.5]],['Crypte',8,[15.5,13.5]],['Plateformes',7,[20.5,11.5]],['Secret',6,[6.5,11.5]],['Boss',9,[14.5,14.5]]]){const b=document.createElement('button');b.textContent=title;b.onclick=()=>show(i,pos);document.querySelector('header').append(b);}
const b=document.createElement('button');b.textContent='Îles';b.onclick=()=>{const save=BK.loadAdventure('adam');save.unlocked=10;BK.saveAdventure('adam',save);current=new BK.WorldSelect('adam',{zoom:'chateau'});current.render(ctx);};document.querySelector('header').append(b);
for(const [title,run] of [['Matthieu',()=>{show(9,[14.5,14.5]);const W=current.world;W.hurtEnemy(W.enemies.find(e=>e.castleBoss),current.player,99,'bomb');W.updateArenaEffects(4.1);current.render(ctx);current.player.y=10.5;current.updateCamera(0,true);W.enemies=W.enemies.filter(e=>!e.dead);current.render(ctx);}],['Tuyau',()=>show(6,[5.5,44.5])]]){const b=document.createElement('button');b.textContent=title;b.onclick=run;document.querySelector('header').append(b);}const reveal=document.createElement('button');reveal.textContent='Ouvrir le secret';reveal.onclick=()=>{show(6,[6.5,11.5]);current.world.destroyBlock(6,9,current.player);current.world.updateParticles(.18);current.render(ctx);};document.querySelector('header').append(reveal);
const motion=document.createElement('button');motion.textContent='Animer les plateformes';motion.onclick=()=>{show(7,[20.5,11.5]);const preview=current;let last=performance.now();function frame(now){if(current!==preview)return;const dt=Math.min(.04,(now-last)/1000);last=now;preview.world.time+=dt;preview.world.updateMovers(dt);preview.world.updateElevators(dt);preview.render(ctx);requestAnimationFrame(frame);}requestAnimationFrame(frame);};document.querySelector('header').append(motion);const options=document.createElement('button');options.textContent='Options éditeur';options.onclick=()=>{let panel=document.getElementById('editor-panel');if(!panel){panel=document.createElement('div');panel.id='editor-panel';panel.style.cssText='padding:20px;background:#e9ddff;color:#241d36';document.querySelector('header').after(panel);}const E=new BK.Editor({name:'Options',theme:'castle',cols:12,rows:8,grid:Array(8).fill('.'.repeat(12)),props:{}});E.item=BK.EDITOR_TABS.flatMap(t=>t.items).find(i=>i.opts==='movingPlatform');E.renderOptions();panel.replaceChildren(E.optBox);for(const name of ['autoLift','secretWall']){const b=document.createElement('button');b.textContent=name==='autoLift'?'Options ascenseur':'Options mur fissuré';b.onclick=()=>{E.item=BK.EDITOR_TABS.flatMap(t=>t.items).find(i=>i.opts===name);E.renderOptions();};panel.append(b);}};document.querySelector('header').append(options);show(5);
</script><script>
for(const [label,fn] of [
['Duel',()=>{const a=new BK.Adventure('adam',5);current=new BK.Duel(a,'demo',{duelistLevel:1});current.state='play';current.render(ctx);}],
['Dôme',()=>{const W=new BK.World({map:Array(13).fill('.'.repeat(13)),theme:'castle',explore:true,mode:'adventure',hearts:true,itemChance:0});const p=W.addPlayer(BK.charById('adam'),6,6,{fire:4});p.dome=true;W.placeBomb(p);W.explodeBomb(W.bombs[0]);for(const f of W.flames)f.t=.22;for(const d of W.domeBursts||[])d.t=.12;const cam=new BK.Camera(1280,800);cam.fit(13,13,{top:100,bottom:35,left:30,right:30});current={world:W,cam,render:()=>W.render(ctx,cam,{})};current.render();}],
['Ponts relevés',()=>{const rows=Array.from({length:11},(_,r)=>Array.from({length:15},(_,c)=>r<3||r>7?',':'~'));rows[8][7]='1';const props={'4,7':{blastDrawbridge:{direction:2,length:5}},'10,7':{blastDrawbridge:{direction:2,length:5}}};for(let r=3;r<=7;r++){rows[r][1]='=';props['1,'+r]={raisedBridge:'A',lv:2,bridgeColumn:r===4||r===6};}const W=new BK.World({map:rows.map(r=>r.join('')),props,theme:'castle',explore:true,mode:'adventure',hearts:true,itemChance:0});W.addPlayer(BK.charById('adam'),7,8);const cam=new BK.Camera(1280,800);cam.fit(15,11,{top:120,bottom:40,left:40,right:40});current={world:W,cam,render:()=>W.render(ctx,cam,{})};current.render();}],
['Abaisser les ponts',()=>{for(const b of current.world.blastDrawbridges||[])current.world.hitBlastDrawbridge(b.c,b.r,{cx:b.c,cy:b.r});current.world.updateArenaEffects(.7);current.render(ctx);}],
['Ponts abaissés',()=>{current.world.updateArenaEffects(.6);current.render(ctx);}]
]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;document.querySelector('header').append(b);}
</script><script>
for(const [label,fn]of [
 ['Dôme : début',()=>{for(const d of current.world.domeBursts||[])d.t=.025;current.render(ctx);}],
 ['Dôme : déclin',()=>{for(const d of current.world.domeBursts||[])d.t=d.duration*.83;current.render(ctx);}],
 ['Dôme rouge',()=>{for(const d of current.world.domeBursts||[]){d.level=2;d.duration=BK.FLAME_TIME*2;d.t=.24;}current.render(ctx);}],
 ['Animer le dôme',()=>{const preview=current,world=preview.world;const p=world.players[0];world.flames=[];world.flameAt.clear();world.domeBursts=[];p.dome=true;world.placeBomb(p);world.explodeBomb(world.bombs[0]);let last=performance.now();function frame(now){if(current!==preview)return;const dt=Math.min(.04,(now-last)/1000);last=now;world.time+=dt;world.updateArenaEffects(dt);world.updateFlames(dt);preview.render(ctx);if(world.domeBursts.length)requestAnimationFrame(frame);}requestAnimationFrame(frame);}]
]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;document.querySelector('header').append(b);}
</script><script>
const fantasyButton=document.createElement('button');fantasyButton.textContent='Nouveaux monstres';fantasyButton.onclick=()=>{
const W=new BK.World({map:Array(13).fill(','.repeat(21)),theme:'forest',explore:true,mode:'adventure',hearts:true,itemChance:0});
for(const [type,c,r]of [['dragon_tricephale',4,5],['ninja_bombardier',10,5],['clown_artificier',16,5],['bombe_coureuse',4,10],['guimauve',10,10],['loup_garou',16,10]]){const e=W.addEnemy(type,c,r);e.t=2;if(type==='bombe_coureuse'){e.fuseLeft=5;e.bombFlash=false;}if(type==='loup_garou')e.state='charge';}
const cam=new BK.Camera(1280,800);cam.fit(21,13,{top:80,bottom:70,left:25,right:25});current={world:W,cam,render:()=>{W.render(ctx,cam,{});ctx.save();ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.strokeStyle='#273846';ctx.lineWidth=4;ctx.fillStyle='#fff';for(const e of W.enemies){const p=cam.project(e.x,e.y+.75,0);ctx.strokeText(e.name,p.x,p.y+22);ctx.fillText(e.name,p.x,p.y+22);}ctx.restore();}};current.render();};document.querySelector('header').append(fantasyButton);
</script>
