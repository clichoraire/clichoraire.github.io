<!doctype html><meta charset="utf-8"><title>Galerie du bestiaire</title><style>body{background:#b5ddfc;font:16px sans-serif;color:#292844}main{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}article{background:#fff9dd;border-radius:20px;text-align:center;padding:8px}canvas{width:130px;height:140px}h1{font-size:24px}</style><h1>Bestiaire · silhouettes et variantes</h1><main></main><script src="../js/config.js"></script><script src="../js/decor-biomes.js"></script><script src="../js/wildlife.js"></script><script src="../js/bestiary.js"></script><script src="../js/camera.js"></script><script src="../js/sprites.js"></script><script src="../js/sprites-biomes.js"></script><script src="../js/sprites-wildlife.js"></script><script src="../js/world.js"></script><script src="../js/inventory.js"></script><script src="../js/input.js"></script><script src="../js/audio.js"></script><script src="../js/ai.js"></script><script src="../js/encounter.js"></script><script src="../js/traps.js"></script><script src="../js/bestiary-world.js"></script><script src="../js/sprites-bestiary.js"></script><script>for(const b of BK.BESTIARY){const a=document.createElement('article'),c=document.createElement('canvas');c.width=180;c.height=190;const ctx=c.getContext('2d');ctx.translate(90,170);BK.sprites.drawEnemy(ctx,b.id,{s:BK.ENEMIES[b.id].boss?75:110,t:1});a.append(c,document.createTextNode(b.name));document.querySelector('main').append(a);}</script>
