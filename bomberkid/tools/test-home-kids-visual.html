<!doctype html><meta charset="utf-8"><style>body{background:#899dc3;font:18px sans-serif}section{display:flex}canvas{width:200px;height:225px}article{text-align:center}</style><div id="gallery"></div><script>window.BK={};</script><script src="../js/home-kids.js"></script><script>
const img=new Image();img.src='../assets/title-kids-sheet.png';img.onload=()=>{let checks=[];for(let row=0;row<5;row++){let section=document.createElement('section');gallery.append(section);let canvases=[];for(let frame=0;frame<4;frame++){let box=document.createElement('article');box.append(document.createTextNode(['Repos','Yeux fermés','Coucou ←','Coucou →'][frame]));let c=document.createElement('canvas');c.width=320;c.height=360;box.append(c);section.append(box);BK.drawHomeKid(c.getContext('2d'),img,row,frame,frame===2?-.09:.09);canvases.push(c);}
let a=canvases[0].getContext('2d').getImageData(0,0,320,360).data,b=canvases[1].getContext('2d').getImageData(0,0,320,360).data;let ys=[0,306,576,864,1153,1402],scale=320/270,dy=360-(ys[row+1]-ys[row])*scale,changed=0,outside=0;for(let y=0;y<360;y++)for(let x=0;x<320;x++){let i=(y*320+x)*4;if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2]||a[i+3]!==b[i+3]){changed++;let inEye=BK.homeKidsArt[row].eyes.some(([ex,ey])=>Math.abs(x-(ex-16)*scale)<24&&Math.abs(y-(dy+(ey-ys[row])*scale))<20);if(!inEye)outside++;}}checks.push('Jeune '+(row+1)+': '+changed+' pixels des yeux animés, '+outside+' pixels modifiés ailleurs');}let result=document.createElement('pre');result.id='checks';result.textContent=checks.join('\n');gallery.prepend(result);};
</script>
