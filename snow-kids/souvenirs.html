<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nos souvenirs</title><style>
*{box-sizing:border-box}body{margin:0;background:#102638;color:#f7f3df;font-family:system-ui,sans-serif}header{max-width:1200px;margin:auto;padding:40px 24px 22px}h1{font-size:clamp(36px,7vw,72px);margin:10px 0}p{color:#bbd4df}a,button{color:inherit}a{display:inline-block;padding:10px 0}main{max-width:1200px;margin:auto;padding:12px 24px 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}main button{border:0;padding:12px 12px 20px;background:#fff7e5;color:#243c4b;box-shadow:0 12px 26px #0004;border-radius:6px;cursor:pointer;transition:transform .2s;font:700 18px system-ui}main button:hover{transform:translateY(-5px) rotate(-1deg)}main img{width:100%;height:290px;object-fit:cover;border-radius:3px;margin-bottom:12px}button:focus-visible,a:focus-visible{outline:4px solid #ffc34a;outline-offset:4px}dialog{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border:0;padding:65px 12px 90px;background:#08151bf5;color:white}dialog::backdrop{background:#08151b}dialog img{display:block;width:100%;height:100%;object-fit:contain}dialog nav{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px}dialog button{border:1px solid #ffffff50;border-radius:30px;background:#23485e;padding:12px 22px;cursor:pointer;font:700 16px system-ui}.close{position:absolute;right:20px;top:14px}#caption{max-width:45%;text-align:center}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><header><a href="index.html">← Retour au jeu</a><p>Une petite surprise, juste pour nous.</p><h1>La famille en dessins.</h1><p>Nos souvenirs dans l’univers de Snow Kids.</p></header><main id="photos"></main><dialog aria-label="Photo agrandie"><button class="close">Fermer ✕</button><img alt=""><nav><button id="prev" aria-label="Photo précédente">←</button><span id="caption" aria-live="polite"></span><button id="next" aria-label="Photo suivante">→</button></nav></dialog><script>
const photos=[{"src": "assets/shop-photos/jay-cartoon.png", "name": "La famille de Jay"}, {"src": "assets/shop-photos/jo-cartoon.png", "name": "La famille de Jo"}, {"src": "assets/shop-photos/couple-cartoon.png", "name": "Mickael et Marie"}, {"src": "assets/shop-photos/grandsparents-cartoon.png", "name": "Josée et Richard"}, {"src": "assets/shop-photos/edison-cartoon.png", "name": "Edison"}],grid=document.querySelector('main'),modal=document.querySelector('dialog');let current=0;
function show(i){current=(i+photos.length)%photos.length;const photo=photos[current];modal.querySelector('img').src=photo.src;modal.querySelector('img').alt=photo.name;document.getElementById('caption').textContent=photo.name+' · '+(current+1)+' / '+photos.length;}
photos.forEach((p,i)=>{const b=document.createElement('button'),img=document.createElement('img'),name=document.createElement('span');img.src=p.src;img.alt=p.name;img.loading='lazy';name.textContent=p.name;b.append(img,name);b.onclick=()=>{show(i);modal.showModal()};grid.append(b)});
modal.querySelector('.close').onclick=()=>modal.close();document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);modal.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});
</script></html>
